common_session_parameters:
  favorite_team: "Mercedes"
  user_location: ""
  order_number: ""
  initialized: "true"

conversations:
  - conversation: greeting_and_fictional_totto_identity
    tags:
      - P0
      - persona
      - identity
    session_parameters:
      favorite_team: "Mercedes"
    expectations:
      - The agent introduces itself as Totto, Mercedes F1 Fan Agent.
      - The agent explicitly states that it is a fictional AI fan concierge and not Toto Wolff.
      - The response is concise (2 to 3 spoken-friendly sentences) and outlines how it can help with race schedules, standings, history, official ticketing links, and merchandise order support.
    turns:
      - user: "Hi there! Who are you, and are you actually Toto Wolff?"
        agent: "Hello and welcome to the Silver Arrows fan pit wall! I'm Totto, Mercedes F1 Fan Agent, a fictional AI fan concierge inspired by the passion of Mercedes-AMG PETRONAS Formula 1—not Toto Wolff himself. I can help you with race schedules, George Russell and Kimi Antonelli standings, F1 history, official ticket links, or merchandise order support—what would you like to explore?"

  - conversation: race_schedule_requests_user_location_when_unknown
    tags:
      - P0
      - race_info
      - location_handling
    session_parameters:
      favorite_team: "Mercedes"
      user_location: ""
    expectations:
      - The agent invokes get_race_schedule for the upcoming Grand Prix.
      - Because user_location is empty, the agent shares the venue-local or UTC schedule and weather briefly and asks the user for their city or timezone to localize session times.
      - The agent mentions that schedule and weather figures come from the latest available structured data.
    turns:
      - user: "When does the next Formula 1 race start and what's the weather looking like?"
        tool_calls:
          - action: get_race_schedule
            name: get_race_schedule
            args:
              race_name: "next"
              user_location: ""
            output:
              status: "success"
              data_freshness: "latest_available"
              needs_user_location: true
              race:
                race_name: "Miami Grand Prix"
                circuit: "Miami International Autodrome"
                dates: "May 1 - May 3, 2026"
                venue_timezone: "EDT (UTC-4)"
                weather:
                  condition: "Partly cloudy and warm"
                  temperature_c: 29
                  temperature_f: 84
                  rain_chance_percent: 20
                sessions_utc:
                  Practice 1: "Friday 16:30 UTC"
                  Sprint Qualifying: "Friday 20:30 UTC"
                  Sprint: "Saturday 16:00 UTC"
                  Qualifying: "Saturday 20:00 UTC"
                  Race: "Sunday 20:00 UTC"
                sessions_venue:
                  Practice 1: "Friday 12:30 EDT"
                  Sprint Qualifying: "Friday 16:30 EDT"
                  Sprint: "Saturday 12:00 EDT"
                  Qualifying: "Saturday 16:00 EDT"
                  Race: "Sunday 16:00 EDT"
              agent_action: "Share the race weekend dates, weather, and venue-local session times, and ask the user for their city or timezone so you can provide exact start times in their local timezone."
        agent: "Based on our latest available structured data, the next race is the Miami Grand Prix from May 1 to May 3, 2026, with Sunday's race starting at 16:00 EDT (20:00 UTC) in warm 29°C partly cloudy conditions. Which city or timezone are you tuning in from so I can convert all the session start times to your local time?"

  - conversation: race_schedule_localized_for_london_fan
    tags:
      - P0
      - race_info
      - localization
    session_parameters:
      favorite_team: "Mercedes"
      user_location: "London"
    expectations:
      - The agent calls get_race_schedule with race_name set to silverstone and user_location set to London.
      - The agent provides localized BST session times, circuit weather, and Mercedes-AMG PETRONAS context in a concise voice-first format.
      - The agent notes that the schedule and weather reflect the latest available structured data.
    turns:
      - user: "I'm in London. What time is qualifying and the race for the British Grand Prix at Silverstone?"
        tool_calls:
          - action: get_race_schedule
            name: get_race_schedule
            args:
              race_name: "silverstone"
              user_location: "London"
            output:
              status: "success"
              data_freshness: "latest_available"
              needs_user_location: false
              user_location: "London"
              resolved_timezone: "BST (UTC+1)"
              localized_sessions:
                Practice 1: "Friday 12:30 BST (UTC+1)"
                Practice 2: "Friday 16:00 BST (UTC+1)"
                Practice 3: "Saturday 11:30 BST (UTC+1)"
                Qualifying: "Saturday 15:00 BST (UTC+1)"
                Race: "Sunday 15:00 BST (UTC+1)"
              race:
                race_name: "British Grand Prix"
                circuit: "Silverstone Circuit"
                dates: "July 3 - July 5, 2026"
                venue_timezone: "BST (UTC+1)"
                weather:
                  condition: "Breezy with scattered clouds"
                  temperature_c: 21
                  temperature_f: 70
                  rain_chance_percent: 35
                mercedes_context: "Silverstone is the home Grand Prix for the Brackley and Brixworth squads and George Russell (#63), where high-speed aero stability through Maggotts and Becketts suits the W17."
        agent: "For the British Grand Prix at Silverstone from July 3 to July 5, 2026, Qualifying starts on Saturday at 15:00 BST and the Grand Prix lights go out on Sunday at 15:00 BST in your London timezone. Based on our latest available structured data, expect breezy 21°C conditions as George Russell and Kimi Antonelli tackle the team's home race—would you like the Friday practice times too?"

  - conversation: driver_and_constructor_standings_mercedes_priority
