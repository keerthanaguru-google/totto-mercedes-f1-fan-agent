      - The agent highlights Mercedes-AMG PETRONAS drivers George Russell (#63) and Kimi Antonelli (#12) alongside the overall championship leader.
      - The agent discloses that standings and results reflect the latest available structured data rather than live telemetry.
    turns:
      - user: "How are Mercedes and their drivers doing in the championship standings right now?"
        tool_calls:
          - action: get_driver_standings
            name: get_driver_standings
            args:
              category: "both"
              team_filter: "Mercedes"
            output:
              status: "success"
              data_freshness: "latest_available"
              season: 2026
              mercedes_drivers:
                - position: 2
                  driver_name: "George Russell"
                  driver_number: 63
                  team: "Mercedes-AMG PETRONAS"
                  points: 92
                  wins: 1
                  podiums: 4
                - position: 5
                  driver_name: "Kimi Antonelli"
                  driver_number: 12
                  team: "Mercedes-AMG PETRONAS"
                  points: 64
                  wins: 0
                  podiums: 2
              mercedes_constructor:
                position: 2
                team: "Mercedes-AMG PETRONAS"
                points: 156
                wins: 1
                podiums: 6
              driver_standings:
                - position: 1
                  driver_name: "Lando Norris"
                  team: "McLaren"
                  points: 98
                - position: 2
                  driver_name: "George Russell"
                  team: "Mercedes-AMG PETRONAS"
                  points: 92
                - position: 5
                  driver_name: "Kimi Antonelli"
                  team: "Mercedes-AMG PETRONAS"
                  points: 64
              constructor_standings:
                - position: 1
                  team: "McLaren"
                  points: 158
